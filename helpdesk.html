<!DOCTYPE html> 
<html>
    <head> 
        <meta charset ="utf-8">
        <meta name ="description" content = "Helpdesk HTML form">
        <meta name ="keywords" content="HTML, Form, tags">
        <meta name = "author" content = "Danial"> 
        <title> CWA Help Desk Appointment  </title>
    </head>

    <body> 
        <img src = "logo.png" alt = "Swinburne Logo" width = "120" height = "60" >
        <h1> CWA Help Desk Appointment  </h1>
        <p> The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
        <p> Check Blackboard for when CWA tutors will be there.</p>
        <form method="post" action="https://mercury.swin.edu.au/it000000/formtest.php">
          <fieldset>
             <legend> Student details </legend>
              <P> 
                <label for ="StudentID"> Student ID: </label>
                <input type = "text" name = "studentID" id = "studentID"  pattern = "[0-9]{7,10}" required > 

                <br>
                <br> 

                <label for ="Given_name"> Given name: </label>
                <input type = "text" name = "Given_name" id = "Given_name" pattern ="[A-Za-z\s]+" required>
                <label for ="Family_name"> Family name: </label>
                <input type = "text" name = "Family_name" id = "Family_name" pattern ="[A-Za-z\s]+" required>
               </P>

            </fieldset>

            <fieldset>
                <legend> Your unit  </legend>
                <p>
                    <label for = "COS10011"> COS10011 </label>
                    <input type = "checkbox" name = "Unit" id = "COS10011" value = "COS10011" checked>
                    <label for = "COS60004"> COS60004 </label>
                    <input type = "checkbox" name = "Unit" id = "COS60004" value = "COS60004" > 
                    <label for = "COS60007"> COS60007 </label>
                    <input type = "checkbox" name = "Unit" id = "COS60007" value = "COS60007" >

                    <br> 
                    <br> 

                 <label for = "Tutor"> Your Tutor</label> 
                    <select name = "Tutor" id = "Tutor" required>
                        <option value = ""> Please select a tutor</option>
                        <option value = "Ali"> Ali </option>
                        <option value = "Muthu"> Muthu </option>
                        <option value = "Lee"> Lee </option>
                    </select>

                </p>
            </fieldset>

            <fieldset>
                <legend> Issue </legend>
                <p> 
                    <label for = "HTML"> HTML </label>
                    <input type = "checkbox" name = "Issue" id="HTML" value = "HTML" >
                    <label for = "CSS"> CSS </label>
                    <input type = "checkbox" name = "Issue" id="CSS" value = "CSS" >
                    <label for = "JavaScript"> JavaScript</label>
                    <input type = "checkbox" name = "Issue" id="JavaScript" value ="JavaScript">
                    <label for = "PHP"> PHP</label>
                    <input type = "checkbox" name = "Issue" id="PHP" value ="PHP">
                    <label for = "MySQL"> MySQL</label>
                    <input type = "checkbox" name = "Issue" id="MySQL" value ="MySQL">

                    <br>
                    <br>

                </p>

                <p><label>Description of Issue

                    <br> 
                    <textarea placeholder="Write description of your problem here..."
                    name="DescriptionOfIssue" rows="8" cols="40"></textarea>
                    
                </label>
                </p>
            </fieldset>

            <fieldset> 
                <legend>Preferred Date/Time </legend>
                <p> 
                    <label for ="Date">Date</label>
                    <input type = "text" name ="Date" id = "Date" placeholder = "dd/mm/yyyy" pattern = "[0-9]{2}/[0-9]{2}/[0-9]{4}" required>

                    <br> 
                    <br>

                    <label for ="Time">Time</label>
                    <input type ="text" name="Time" id ="Time" placeholder = "hh:mm" pattern = "[0-9]{2}:[0-9]{2}" required>
                </p>
            </fieldset>


           <input type = "submit" value = "Book"> 
           <input type ="reset" value = "Reset Form">

        </form>
        
    
    
    
    </body>


</html>
